name: Build iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-compile:
    runs-on: macos-14
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        set-safe-directory: 'true'

    - name: Install Rosetta 2 for Old Intel Unity
      run: |
        echo "Activating Rosetta 2 emulating layer..."
        softwareupdate --install-rosetta --agree-to-license || true

    - name: Download and Extract Unity 5.6.7f1
      run: |
        echo "Downloading raw editor archives..."
        curl -L -f -o "Unity-5.6.7f1.pkg" "https://unity3d.com"
        
        echo "Creating application directory paths directly..."
        sudo mkdir -p /Applications/Unity
        
        echo "Extracting raw archive binaries directly to system..."
        # We unzip the data payload straight to the target folder, bypassing the installer app completely!
        sudo xar -xf Unity-5.6.7f1.pkg UnityEditor.pkg/Payload
        sudo tar -xvf UnityEditor.pkg/Payload -C /Applications/Unity/
        
        echo "Cleaning work workspace logs..."
        rm -rf Unity-5.6.7f1.pkg UnityEditor.pkg

    - name: Run Unity Export
      run: |
        echo "Compiling project into iOS source code..."
        arch -x86_64 /Applications/Unity/Unity.app/Contents/MacOS/Unity \
          -batchmode \
          -quit \
          -projectPath . \
          -buildTarget ios \
          -executeMethod UnityEditor.BuildPlayerWindow.BuildPlayerAndRun \
          -logFile unity_build.log || true
        cat unity_build.log

    - name: Package IPA
      run: |
        echo "Wrapping application package..."
        mkdir -p Payload
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [ -d "$APP_PATH" ]; then
            echo "Found bundle directory: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          fi
        done
        zip -r "100_Offline_Games.ipa" Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: 100_Offline_Games.ipa
