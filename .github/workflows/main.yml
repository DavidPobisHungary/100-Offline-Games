name: Build iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-compile:
    runs-on: macos-14
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        set-safe-directory: 'true'

    - name: Install Rosetta 2 for Old Intel Unity
      run: |
        echo "Activating Rosetta 2 emulating layer..."
        softwareupdate --install-rosetta --agree-to-license || true

    - name: Download and Extract Unity 5.6.7f1
      run: |
        echo "Starting Unity secure download..."
        # This link downloads the real 2GB installation package, not the homepage!
        curl -L -f -o "UnitySetup.pkg" "https://unity3d.com"
        
        echo "Download complete. Extracting package layers natively..."
        sudo pkgutil --expand-full UnitySetup.pkg ./UnityExtracted
        
        echo "Moving editor binaries to the core system folder..."
        sudo mkdir -p /Applications/Unity
        sudo cp -R ./UnityExtracted/UnityEditor.pkg/Payload/Unity.app /Applications/Unity/
        
        echo "Cleaning up temporary setup archives..."
        rm -rf UnitySetup.pkg ./UnityExtracted

    - name: Run Unity Export
      run: |
        echo "Compiling project into iOS source code..."
        arch -x86_64 /Applications/Unity/Unity.app/Contents/MacOS/Unity \
          -batchmode \
          -quit \
          -projectPath . \
          -buildTarget ios \
          -executeMethod UnityEditor.BuildPlayerWindow.BuildPlayerAndRun \
          -logFile unity_build.log || true
        cat unity_build.log

    - name: Package IPA
      run: |
        echo "Wrapping application package..."
        mkdir -p Payload
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [ -d "$APP_PATH" ]; then
            echo "Found bundle directory: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          fi
        done
        zip -r "100_Offline_Games.ipa" Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: 100_Offline_Games.ipa
