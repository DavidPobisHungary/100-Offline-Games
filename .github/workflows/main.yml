name: Compile iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  compile-project:
    runs-on: macos-14
    steps:
    - name: Checkout iOS Project Files
      uses: actions/checkout@v4

    # This diagnostic step maps out your repository folders so we can see what's inside!
    - name: Map Repository Structure
      run: |
        echo "=== Printing Full Repository Directory Map ==="
        ls -R
        echo "============================================="

    - name: Compile Application Binary
      run: |
        echo "Searching for Xcode project directory..."
        XCODE_PROJ_PATH=$(find . -name "Unity-iPhone.xcodeproj" -type d | head -n 1)
        
        if [ -z "$XCODE_PROJ_PATH" ]; then
          echo "ERROR: Unity-iPhone.xcodeproj could not be found anywhere in the repository!"
          echo "Look at the 'Map Repository Structure' step above to see what files are missing."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$XCODE_PROJ_PATH")
        cd "$PROJECT_DIR"
        
        xcodebuild -project Unity-iPhone.xcodeproj \
                   -scheme Unity-iPhone \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Assemble IPA Package
      run: |
        mkdir -p Payload
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [[ "$APP_PATH" == *"Release-iphoneos"* ]]; then
            cp -r "$APP_PATH" Payload/
          fi
        done
        zip -r "100_Offline_Games.ipa" Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: 100_Offline_Games.ipa
