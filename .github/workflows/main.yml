name: Compile iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  compile-project:
    runs-on: macos-14
    steps:
    - name: Checkout iOS Project Files
      uses: actions/checkout@v4

    - name: Compile Application Binary
      run: |
        echo "Navigating directly to the nested directory..."
        cd "100OfflineGames/100OfflineGames"
        
        echo "Verifying Xcode project targets..."
        if [ ! -d "Unity-iPhone.xcodeproj" ]; then
          echo "ERROR: Unity-iPhone.xcodeproj could not be found inside the directory!"
          ls -la
          exit 1
        fi
        
        echo "Commencing native background compilation..."
        # This compiles the code natively and disables Apple signature checks completely!
        xcodebuild -project Unity-iPhone.xcodeproj \
                   -scheme Unity-iPhone \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Assemble IPA Package
      run: |
        echo "Wrapping application package..."
        mkdir -p Payload
        
        # Scans the build outputs to extract the compiled app bundle
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [[ "$APP_PATH" == *"Release-iphoneos"* ]]; then
            echo "Found compiled binary bundle: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          fi
        done
        
        zip -r "100_Offline_Games.ipa" Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: 100_Offline_Games.ipa
