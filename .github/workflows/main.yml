name: Build iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-14
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Download and Install Unity 5.6.7f1
      run: |
        echo "Unity letöltése indul..."
        curl -L -f -o Unity.pkg "https://unity3d.com"
        echo "Letöltés kész, telepítés indul..."
        sudo installer -pkg Unity.pkg -target /
        rm Unity.pkg

    - name: Run Unity Export
      run: |
        /Applications/Unity/Unity.app/Contents/MacOS/Unity \
          -batchmode \
          -quit \
          -projectPath . \
          -buildTarget ios \
          -executeMethod UnityEditor.BuildPlayerWindow.BuildPlayerAndRun \
          -logFile unity_build.log || true
        cat unity_build.log

    - name: Locate and Package IPA (Filza-Friendly)
      run: |
        mkdir -p Payload
        # Az IFS= beállítás segít, hogy a szóközöket is egyben kezelje a gép
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [ -d "$APP_PATH" ]; then
            echo "Megtalált mappa: $APP_PATH"
            # Idézőjelek közé tesszük az elérést a szóközök miatt
            cp -r "$APP_PATH" Payload/
          fi
        done
        zip -r "100_Offline_Games.ipa" Payload
        
    - name: Upload IPA to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: "100_Offline_Games.ipa"
