name: Compile iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile-project:
    runs-on: macos-14
    steps:
    - name: Checkout iOS Project Files
      uses: actions/checkout@v4

    - name: Compile Application Binary
      run: |
        echo "Searching for Xcode project directory..."
        # Automatically locates the project folder even if it is inside a subfolder
        XCODE_PROJ_PATH=$(find . -name "Unity-iPhone.xcodeproj" -type d | head -n 1)
        
        if [ -z "$XCODE_PROJ_PATH" ]; then
          echo "ERROR: Unity-iPhone.xcodeproj could not be found anywhere in the repository!"
          echo "Please ensure you pushed the files generated by Unity's iOS build button."
          exit 1
        fi
        
        # Navigate to the directory containing the project file
        PROJECT_DIR=$(dirname "$XCODE_PROJ_PATH")
        cd "$PROJECT_DIR"
        echo "Found project in: $PROJECT_DIR. Starting build process..."
        
        xcodebuild -project Unity-iPhone.xcodeproj \
                   -scheme Unity-iPhone \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Assemble IPA Package
      run: |
        echo "Packaging standard application layout..."
        mkdir -p Payload
        # Dynamically scans the system to grab the compiled application file
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [[ "$APP_PATH" == *"Release-iphoneos"* ]]; then
            echo "Found compiled app: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          fi
        done
        zip -r "100_Offline_Games.ipa" Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: 100_Offline_Games.ipa
