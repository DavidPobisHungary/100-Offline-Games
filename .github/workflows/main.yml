name: Compile iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile-project:
    runs-on: macos-14
    steps:
    - name: Checkout iOS Project Files
      uses: actions/checkout@v4

    - name: Compile Application Binary
      run: |
        echo "Building raw application binary from source..."
        # This builds the raw game binary natively using the Mac's built-in tools!
        xcodebuild -project Unity-iPhone.xcodeproj \
                   -scheme Unity-iPhone \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Assemble IPA Package
      run: |
        echo "Packaging standard application layout..."
        mkdir -p Payload
        # Moves the freshly compiled .app folder straight into the package path
        cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        zip -r "100_Offline_Games.ipa" Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: iPhone4-App-IPA
        path: 100_Offline_Games.ipa
