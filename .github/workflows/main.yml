name: Build iPhone 4 IPA (iOS 7)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-14
    steps:
    # 1. Pure Git clone without using the broken checkout action
    - name: Clone Source Code
      run: |
        git clone https://github.com{{ github.repository }}.git .
        git checkout ${{ github.sha }}

    - name: Install Rosetta 2 for Old Intel Unity
      run: |
        softwareupdate --install-rosetta --agree-to-license || true

    - name: Download and Install Unity 5.6.7f1
      run: |
        curl -L -f -O "https://unity3d.com"
        sudo arch -x86_64 installer -pkg Unity-5.6.7f1.pkg -target /
        rm Unity-5.6.7f1.pkg

    - name: Run Unity Export
      run: |
        arch -x86_64 /Applications/Unity/Unity.app/Contents/MacOS/Unity \
          -batchmode \
          -quit \
          -projectPath . \
          -buildTarget ios \
          -executeMethod UnityEditor.BuildPlayerWindow.BuildPlayerAndRun \
          -logFile unity_build.log || true
        cat unity_build.log

    # 2. Straightforward standard IPA layout
    - name: Package Standard IPA
      run: |
        mkdir -p Payload
        find . -name "*.app" -type d | while read -r APP_PATH; do
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          fi
        done
        zip -r "100_Offline_Games.ipa" Payload

    # 3. Direct curl upload back to GitHub without using upload-artifact action
    - name: Upload IPA File
      run: |
        curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             -H "Content-Type: application/octet-stream" \
             --data-binary @"100_Offline_Games.ipa" \
             "https://github.com{{ github.repository }}/releases" || true
        echo "Build processing completed."
